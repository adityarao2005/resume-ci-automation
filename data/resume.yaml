      - [Nov 2025] Modernized L3 Support and development report tool generation to use thymeleaf templates instead of XSL and manual printwriter html tag creation, JAXB instead of eclipse emf and osgi api, mavenized project instead of ant + eclipse based builds, with java 17 runtime. Also updated web view on openliberty to use jakartaee apis and added a jsf based tracker to analyze who is using these reports.
      - [Dec 2025] Started working on some build breaks (featureUtility and installUtility) for OpenLiberty and WebSphere Liberty for Install/Sessions/Profiles (found bug on z/OS in sessions FAT regarding IPv4 and IPv6 on z/OS and reported to kernel team for fix).
      - [Jan 2026] Worked on performing migration of old ticketing tool was Ruby on Rails from maybe 20+ years ago which invoked the Java API calls via shell and had mysql db (lets name App A) and the CSP migration would split that from CMVC related functions (our code stuff for WebSphere APplication Server) (lets name it App B) and CSP focused minimal KI/actual itcket app (2 different apps) to 2 different apps. App A handled both some code change administration and ticketing stuff since the 2 at the time were very tightly coupled in their delivery process. For app A, i did an evaluation of all the features and consulted the L3 Architect on what is still used and whats not and rearchitected and redesigned everything to be a Spring Boot 4 backend with Next.js React frontend talking to PostgreSQL for storage (only when needed like when admin needs to review ticket before being closed to verify if closure information is correct, before the old app used to store everything in the DB and ran into stale data and syncing issues) - mind you this is all still using old RETAIN based ticketing system - all secured with Auth.js on frontend (since OIDC and SSO support is better than BetterAuth. replacing LDAP) and made the spring boot backend a resource server and also made it support containerization from the beginning. This took 3 weeks of time with constant valdiation and feedback from the l3 architect and then GAd after 3 weeks and ofc fixed some bugs along the way. GA happened in Jan 2026. I added a ton of tests, unit tests, integration tests, e2e tests, I even made a test which tested whether App A logic handled the full ticket cycle. I also upgraded the frontend to use the latest library of carbon ui to get rid of dead sass deps and upgraded node too. Made it run on Java 21.
      - [Feb 2026] created for the workflow distribution dashboard, created in next.js and quarkus, got OIDC, postgres, quarkus scheduler based cron which fetches and updates internal catalog of people in the departments for managment changes, containerized, native builds via mandrel/graalvm running. running o njava 21 replacing kaizen based spreadsheets saving time per manager of 1 hour per week.
      - [Feb 2026] Solved customer case regarding session persistence on Liberty and Keycloak on OCP using Infinispan and RH Data Grid (was user error and customer using non-serializable classes trying to have it persisted across caches but ofc since non-serializable it only stayed in the pods memory only).
      - [March 2026] Migrated ifix/patch publishing tool since it was originally on WebSphere Application Server 9 and on a Windows machine and that it was a publishing tool which was very sensitive, very prone to crash or go down, something which needed a lot of uptime and was difficult to recreate the environment and required DB2 and was timeconsumingto setup, we decided to lift and shift to openliberty since liberty has much better performance and stability and made things much easier to setup. We ran into some problems like some sepcialized logging apis, jax-xpc, commonj sdo (such outdated and unmaintained stuff) but we managed to work around it and get it working on openliberty. We also reskinned the UI to work with Carbon UI but it was still mostly servlets, ejb, ldap, and jsp stuff but lift and shift by any means is still tough (mostly cuz a library this depended on required us to use javaee). Made it run on Java 17.
      - [April 2026] Worked on feature for MoRE which allowed people to modify the tWAS build configuration based on tWAS fixpack upgrades and downgrades for specialized plugins such as supporting Jakarta MQRA resource adapters and sharing thread pool for jobs between tWAS based app servers and liberty based app servers.
      - [April 2026] Created v1 prototype for internal hackathon based on IBM Bob - AI powered build break and diagnosis tool. Shell based which uses OpenLiberty MCP beta feature to access API's for requesting build break information and using various skills and rules for guiding AI Agent (Bob Shell) on how to analyze the build break. Also provided access to build break logs and OpenLiberty + WebSphere Liberty source code. 
      - [May 2026] Worked on OpenLiberty product work making minor changes here and there and implemented feature in installUtility to support verisonless features.
      - [May 2026] Discovered several security related bugs (not CVE exploits, just behavioral bugs) in OpenLiberty and reported them to the team and got speedy fixes (all for Jakarta Security) and regarding the JakartaEE 11 and the HAM based authentication.
      - [June 2026] Isolate installUtility FATs to use a duplicate build image of openliberty rather than the main image used by all the product code FATs since any changes in features could break other FATs.
      - [July 2026] had Salesforce CSP migration, which meant trashing the old RETAIN based stuff for CSP (we were maintaining a special  CSP branch for App D and App E, App A would be split into App B and App C). Which we did and we fixed a bunch of stuff (reason i heard from l3 architect was cuz they wanted to do it in our time cuz talent was there and our batch of interns did a ton of work transforming these legacy apps into modern stuff).
      - [July 2026] Iterated on internal hackathon project and created v2 of it, which provided WebUI for requesting builds, creating build breaks from the web (automating manual stuff), viewing build breaks by functional area, then running analysis on build break (using old mechanism) and supported queueing and batch processing via kafka queues sending build break across multiple bob agent workers all orchestrated via docker compose and using PostgeSQL for storage.
      - [July-August 2026] later one of the libraries that the publishing tool we lifted and shifted depended on made an update to run on Jakarta APIs so we did a full wipeout modernization from clean slate which used JakartaEE 11 (since thats when it was introduced into liberty around that time) and MicroProfile 7.1 apis to assist us, especially Jakarta Data, MP Reactive Messaging with Kafka to distribute messages to "publish workers", and bundling our frontend via Vite, adding unit and integration tests, using Jakarta RestfulWS, JSON-B, and all that fun stuff and all containerized running on java 21 containers. The publish time was reduced from couple hours to 1 min.
