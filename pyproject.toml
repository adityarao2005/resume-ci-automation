[project]
name = "resume-ci-automation"
version = "0.1.0"
description = "Generates resumes from ci"
authors = [
    {name = "Aditya Rao", email = "adityarao2005@gmail.com"},
]
dependencies = ["jinja2>=3.1.6", "pyyaml>=6.0.3", "pydantic>=2.12.4"]
requires-python = ">=3.11"
license = {text = "MIT"}

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_ci_automation"]
